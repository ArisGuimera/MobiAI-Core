name: Check skills docs

# Bloquea PRs que agreguen o modifiquen skills sin actualizar la
# documentación. La idea es evitar que el catálogo central
# (`skills/core/skills/using-mobiai/SKILL.md`) y el README queden
# desincronizados respecto a las skills disponibles.

on:
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'skills/**/.claude-plugin/plugin.json'

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify that documentation was updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          # Archivos de skill que cambiaron en este PR.
          # Excluye los skills oficiales vendoreados de Google: se sincronizan
          # automáticamente desde upstream (.github/workflows/sync-android-skills.yml),
          # así que no son contribuciones nuestras y no requieren docs.
          touched_skills=$(echo "$changed" \
            | grep -E '^skills/.*/(SKILL\.md|\.claude-plugin/plugin\.json)$' \
            | grep -v '^skills/android/skills/google/' \
            || true)

          if [ -z "$touched_skills" ]; then
            echo "No changes in first-party skills — skip."
            exit 0
          fi

          echo "Skills touched in this PR:"
          echo "$touched_skills" | sed 's/^/  - /'
          echo

          # Qué archivos cuentan como "documentación de skills".
          touched_docs=$(echo "$changed" \
            | grep -E '^(README\.md|CONTRIBUTING\.md|docs/.+\.md|skills/core/skills/using-mobiai/SKILL\.md)$' \
            || true)

          if [ -z "$touched_docs" ]; then
            echo "::error::This PR adds or modifies skills but does not touch documentation."
            echo
            echo "When you add or change a skill, also update at least one of:"
            echo "  • skills/core/skills/using-mobiai/SKILL.md  (central catalog)"
            echo "  • README.md                                 (available skills table)"
            echo "  • CONTRIBUTING.md                           (if you changed how to contribute)"
            echo "  • docs/*.md                                 (any relevant guide)"
            echo
            echo "If your change is trivial (typo, internal refactor with no user impact)"
            echo "you can justify it in the PR and the reviewer can waive the rule."
            exit 1
          fi

          echo "Docs updated in this PR:"
          echo "$touched_docs" | sed 's/^/  - /'
          echo
          echo "✓ Skill changes accompanied by docs."
