name: release-cli
on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: cli/go.sum

      - name: Strip cli- prefix and create local semver tag
        run: |
          STRIPPED="${GITHUB_REF_NAME#cli-}"
          echo "STRIPPED=$STRIPPED" >> $GITHUB_ENV
          git tag "$STRIPPED"

      - name: Build artifacts with GoReleaser (no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: cli
          args: release --clean --skip=publish --skip=announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.STRIPPED }}

      - name: Publish GitHub release with cli-v* tag
        run: |
          cd cli/dist
          # SemVer-aware prerelease detection. The version is everything
          # after `cli-v`. A `-` in that suffix means a SemVer pre-release
          # identifier (e.g. 1.0.0-rc.1, 0.2.0-beta.3). Stable releases
          # like 1.0.0 have no `-` in the suffix and ship as full releases.
          VERSION="${GITHUB_REF_NAME#cli-v}"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "CLI ${STRIPPED}" \
            --notes "Automated release for tag $GITHUB_REF_NAME" \
            $PRERELEASE_FLAG \
            mobiai-*.tar.gz mobiai-*.zip checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
