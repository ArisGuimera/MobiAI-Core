name: Sync android/skills (vendoring)

on:
  schedule:
    - cron: '0 6 * * 1'  # cada lunes a las 06:00 UTC
  workflow_dispatch:

# Sin pull-requests: write a propósito. El bot pushea la rama y avisa con un
# issue; el PR lo abre un maintainer. Así no hace falta habilitar "Allow GitHub
# Actions to create and approve pull requests", y los checks corren en el PR
# (los PRs abiertos con GITHUB_TOKEN no disparan otros workflows).
permissions:
  contents: write
  issues: write

concurrency:
  group: sync-android-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MobiAI-Core
        uses: actions/checkout@v4

      - name: Checkout android/skills (shallow)
        uses: actions/checkout@v4
        with:
          repository: android/skills
          path: _upstream

      - name: Verify upstream LICENSE is unchanged Apache 2.0
        run: |
          set -euo pipefail
          if ! grep -q "Apache License" _upstream/LICENSE.txt; then
            echo "::error::Upstream LICENSE.txt no longer contains 'Apache License'. Manual review required."
            exit 1
          fi
          if ! grep -q "Version 2.0" _upstream/LICENSE.txt; then
            echo "::error::Upstream LICENSE.txt no longer references Version 2.0. Manual review required."
            exit 1
          fi
          if ! diff -q _upstream/LICENSE.txt skills/android/skills/google/LICENSE > /dev/null; then
            echo "::notice::Upstream LICENSE differs from vendored copy. Will update in the sync PR."
          fi

      - name: Refresh vendored LICENSE, README, and NOTICE
        run: |
          set -euo pipefail
          cp _upstream/LICENSE.txt skills/android/skills/google/LICENSE
          cp _upstream/README.md skills/android/skills/google/README.md
          if [ -f _upstream/NOTICE ]; then
            cp _upstream/NOTICE skills/android/skills/google/NOTICE
          else
            rm -f skills/android/skills/google/NOTICE
          fi

      - name: Sync SKILL.md directories
        id: sync
        env:
          VENDOR_ROOT: skills/android/skills/google
        run: |
          set -euo pipefail
          echo "upstream_sha=$(git -C _upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          mapfile -t upstream_paths < <(find _upstream -name SKILL.md -type f | sort)
          declare -A upstream_names

          for path in "${upstream_paths[@]}"; do
            skill_dir=$(dirname "$path")
            name=$(basename "$skill_dir")
            upstream_names[$name]=1

            target_dir="$VENDOR_ROOT/$name"
            rm -rf "$target_dir"
            mkdir -p "$target_dir"
            cp -r "$skill_dir"/* "$target_dir/"
            echo "Synced: $name"
          done

          for vendored_dir in "$VENDOR_ROOT"/*/; do
            [ -d "$vendored_dir" ] || continue
            name=$(basename "$vendored_dir")
            if [ -z "${upstream_names[$name]:-}" ]; then
              echo "Removing (no longer upstream): $name"
              rm -rf "$vendored_dir"
            fi
          done

      - name: Clean up _upstream clone
        run: rm -rf _upstream

      - name: Detect changes
        id: changes
        env:
          VENDOR_ROOT: skills/android/skills/google
        run: |
          set -euo pipefail
          # git add primero: las skills nuevas son archivos untracked y
          # `git diff` sin --cached no las ve.
          git add -A "$VENDOR_ROOT"
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --cached --stat
          fi

      - name: Push sync branch
        id: push
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH: chore/sync-android-skills
          VENDOR_ROOT: skills/android/skills/google
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          # Si la rama ya tiene exactamente este contenido, upstream no cambió
          # desde el último aviso: no re-pusheamos ni volvemos a notificar.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null \
             && git diff --cached --quiet FETCH_HEAD -- "$VENDOR_ROOT"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "La rama $BRANCH ya está al día con upstream."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "chore: sincronizar android/skills vendoreados" \
            -m "Upstream: android/skills@$UPSTREAM_SHA"
          git push --force origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: chore/sync-android-skills
          TITLE: "chore: sincronizar android/skills vendoreados"
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...chore/sync-android-skills?expand=1
        run: |
          set -euo pipefail
          stat=$(git diff --shortstat HEAD~1 HEAD)
          cat > issue-body.md <<EOF
          El sync semanal trajo cambios de [android/skills](https://github.com/android/skills) a la rama \`$BRANCH\` (upstream \`${UPSTREAM_SHA:0:7}\`):$stat.

          Estas skills se cargan en el contexto de los agentes, así que **no se mergean sin revisión**:

          1. Revisar el diff completo en busca de prompt injection: $COMPARE_URL
          2. Abrir el PR a mano (así corren los checks; un PR abierto por el bot no los dispara):
             \`gh pr create --base main --head $BRANCH --fill\` y agregar \`Closes #<este issue>\` en la descripción.
          3. Si el bot vuelve a actualizar la rama con el PR abierto, revisar de nuevo el diff nuevo antes de mergear.

          Auto-generado por \`.github/workflows/sync-android-skills.yml\`. Apache 2.0 attribution preserved (ver \`NOTICE.md\`).
          EOF
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
